[[params.introduction.paragraph]]
  text=""" I am currently a staff research engineer at Circle. Previously, I was a staff research scientist at Visa Research.

  I was a postdoctoral researcher at University of Bern, working with Professor  [Christian Cachin](https://crypto.unibe.ch/cc/).

  I hold a PhD from Purdue University. I was advised by Professor [Aniket Kate](https://www.cs.purdue.edu/homes/akate/) and Professor [Mikhail Atallah](https://www.cs.purdue.edu/homes/mja/)"""

[[params.areas]]
  slug  = "offchain"
  title = "Off-chain scalability & payment channels"
  blurb = "Moving blockchain applications off-chain while keeping their on-chain guarantees, so the chain is paid for only when something goes wrong."

[[params.areas]]
  slug  = "privacy"
  title = "Privacy-enhancing technologies"
  blurb = "Unlinkability and confidentiality for blockchain transactions, and the models needed to reason about what they actually hide."

[[params.areas]]
  slug  = "consensus"
  title = "Consensus, MEV & incentives"
  blurb = "Security and incentive analysis of permissionless consensus, transaction ordering, and on-chain markets."

[[params.areas]]
  slug  = "crypto"
  title = "Applied cryptography"
  blurb = "Signature schemes, trusted-setup ceremonies, post-quantum migration, and how cryptography is used — and misused — in practice."

